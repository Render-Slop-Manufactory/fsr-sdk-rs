# SPDX-License-Identifier: MPL-2.0

[package]
name = "fsr-sdk-sys"
version = "0.1.2"
description = "Selected raw bindings and explicit Windows/DX12 runtime loading for AMD FSR SDK v2.3.0"
documentation = "https://docs.rs/fsr-sdk-sys/0.1.2/fsr_sdk_sys/"
readme = "README.md"
keywords = ["fsr", "fidelityfx", "dx12", "graphics", "gamedev"]
categories = ["external-ffi-bindings", "rendering", "game-development"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = []
features = ["dx12"]

[features]
default = []
dx12 = ["dep:libloading"]
# Reserved backend; intentionally fails to compile until Vulkan is implemented.
vulkan = []

[target.'cfg(windows)'.dependencies]
libloading = { version = "0.9.0", optional = true }
