# SPDX-License-Identifier: MPL-2.0

name: Set up Rust
description: Install stable Rust and restore the Cargo cache

inputs:
  components:
    description: Comma-separated rustup components
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install stable Rust
      shell: bash
      env:
        SETUP_RUST_COMPONENTS: ${{ inputs.components }}
      run: |
        set -euo pipefail

        install_args=(--profile minimal)
        if [[ -n "$SETUP_RUST_COMPONENTS" ]]; then
          IFS=',' read -ra components <<< "$SETUP_RUST_COMPONENTS"
          for component in "${components[@]}"; do
            component="${component//[[:space:]]/}"
            if [[ -n "$component" ]]; then
              install_args+=(--component "$component")
            fi
          done
        fi

        rustup toolchain install stable "${install_args[@]}"
        rustup default stable
        rustc --version --verbose
        cargo --version --verbose

    - name: Restore Rust cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        prefix-key: "v1-cache"
        cache-bin: false
        save-if: >-
          ${{ github.ref == 'refs/heads/main' ||
              (github.event_name == 'pull_request' &&
               github.event.pull_request.head.repo.full_name == github.repository) }}
