# SPDX-License-Identifier: MPL-2.0

name: Set up Rust
description: Install the selected Rust toolchain and restore the Cargo cache

inputs:
  toolchain:
    description: Rust toolchain version
    required: false
    default: stable
  components:
    description: Comma-separated rustup components
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Rust
      shell: bash
      env:
        SETUP_RUST_TOOLCHAIN: ${{ inputs.toolchain }}
        SETUP_RUST_COMPONENTS: ${{ inputs.components }}
      run: |
        set -euo pipefail

        install_args=(--profile minimal)
        if [[ -n "$SETUP_RUST_COMPONENTS" ]]; then
          IFS=',' read -ra components <<< "$SETUP_RUST_COMPONENTS"
          for component in "${components[@]}"; do
            component="${component//[[:space:]]/}"
            if [[ -n "$component" ]]; then
              install_args+=(--component "$component")
            fi
          done
        fi

        rustup toolchain install "$SETUP_RUST_TOOLCHAIN" "${install_args[@]}"
        rustup default "$SETUP_RUST_TOOLCHAIN"
        rustc --version --verbose
        cargo --version --verbose

    - name: Restore Rust cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        # Old caches included evidence directories under target; never restore them.
        prefix-key: "v2-verification-build-cache"
        workspaces: ". -> target/verification-build"
        cache-bin: false
        save-if: >-
          ${{ github.ref == 'refs/heads/main' ||
              (github.event_name == 'pull_request' &&
               github.event.pull_request.head.repo.full_name == github.repository) }}
