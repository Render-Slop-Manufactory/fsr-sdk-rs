# SPDX-License-Identifier: MPL-2.0
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "1"
jobs:
  verification:
    name: ${{ matrix.toolchain }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            toolchain: stable
            profile: ci
          - os: windows-2025
            toolchain: stable
            profile: ci
          - os: ubuntu-24.04
            toolchain: 1.88.0
            profile: msrv
          - os: windows-2025
            toolchain: 1.88.0
            profile: msrv
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt,clippy
      - name: Check repository size and generated data placement
        run: python tools/verification/repository_size.py
      - name: Run required verification profile
        run: python tools/verification/run.py run ${{ matrix.profile }} --online --require-passed
      - name: Export finalized evidence including failed cases
        if: always()
        run: python tools/verification/run.py export-ci --output target/verification-evidence
      - name: Retain sanitized verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-${{ matrix.os }}-${{ matrix.toolchain }}
          path: target/verification-evidence
          if-no-files-found: warn
          retention-days: 14
